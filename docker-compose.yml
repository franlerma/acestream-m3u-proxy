version: "3.8"

services:
  ipfs-server:
    container_name: ipfs-server
    image: ipfs/kubo:release
    ports:
      - "4001:4001"  # Puerto IPFS Swarm
      - "5001:5001"  # Puerto API IPFS
      - "7654:8080"  # Puerto Gateway IPFS
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - acestream-network
    command: ["daemon", "--migrate=true"]
  acestream-proxy:
    build: .
    ports:
      - "16123:8000"
    env_file: .env
    networks:
      - acestream-network
    depends_on:
      - ipfs-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  ipfs_data:

networks:
  acestream-network:
    driver: bridge