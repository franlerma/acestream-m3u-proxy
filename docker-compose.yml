services:
  ipfs-server:
    container_name: ipfs-server
    image: ipfs/kubo:release
    ports:
      - "4001:4001"  # Puerto IPFS Swarm
      - "5001:5001"  # Puerto API IPFS
      - "7654:8080"  # Puerto Gateway IPFS
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - acestream-network
    command: ["daemon", "--migrate=true"]
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 diag healthy > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  acestream-proxy:
    build: .
    ports:
      - "16123:8000"
    env_file: .env
    networks:
      - acestream-network
    depends_on:
      ipfs-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  ipfs_data:

networks:
  acestream-network:
    driver: bridge